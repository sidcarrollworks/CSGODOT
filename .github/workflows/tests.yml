# Runs scripts/run_tests.sh with a headless Godot on every pull request and
# every push to main, so a change from any agent, local or in the cloud, is
# checked the same way before Sid merges it. The checks that need CS2's
# extracted assets skip themselves here, as on any fresh clone; they still
# run on Sid's machine.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  # A test file that runs longer than this fails rather than holding up the
  # whole job (scripts/run_tests.sh).
  CSGODOT_TEST_TIMEOUT: 180

jobs:
  tests:
    runs-on: ubuntu-latest
    # The first run on a new install script builds Box3D's Linux library
    # (a few minutes), and the first on a new build script godot-cpp (a few
    # more); later ones take them from the cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check Box3D installer
        run: python3 -m unittest discover -s tests -p 'test_box3d_installer.py'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # Pinned source + our opt-in projectile cast. Build locally against
      # the runner's libc; keep compilation outputs for subsequent runs.
      - name: Cache Box3D
        uses: actions/cache@v4
        with:
          path: |
            .godot/box3d-download
            .godot/box3d-build
          key: box3d-${{ runner.os }}-${{ hashFiles('scripts/install_box3d.sh', 'scripts/build_box3d_projectiles.py', 'scripts/box3d-projectiles.patch') }}

      - name: Install pinned Box3D addon
        run: scripts/install_box3d.sh

      # The game's own native code, the movement's step, which every check
      # file then holds to the script's results (tests/check_suite.gd).
      # godot-cpp at its pinned commit and what was compiled are kept between
      # runs, with SCons' record of what it built from, so a change under
      # native/src compiles those files and no more.
      - name: Cache the native build
        uses: actions/cache@v4
        with:
          path: |
            .godot/native-build
            native/build
            native/.sconsign.dblite
          key: native-${{ runner.os }}-${{ hashFiles('scripts/build_native.sh', 'native/SConstruct') }}

      - name: Build the native code
        run: GODOT=~/godot/godot scripts/build_native.sh

      - name: Run the tests
        run: GODOT=~/godot/godot scripts/run_tests.sh
